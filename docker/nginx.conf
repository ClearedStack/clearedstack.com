server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Every page is a folder with an index.html; anything else is a 404.
    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ =404;
    }

    # The Markdown copy of each page (/guides/<slug>.md and so on), for agents
    # and scripts. nginx has no type for .md by default.
    location ~ \.md$ {
        types { }
        default_type text/markdown;
        try_files $uri =404;
    }

    # llms.txt, the Markdown copies and the JSON indexes are UTF-8.
    charset utf-8;
    charset_types text/plain text/markdown application/json;

    # Build output under /_next/static has a content hash in its file name,
    # so browsers can keep it for a long time.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
