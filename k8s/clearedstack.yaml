# ClearedStack on Kubernetes (k3s + containerd, zero Docker):
# control-plane namespace, deployment, and service.
#
# Built via rootless BuildKit (Containerfile) and stored in cs-registry.
#
#   kubectl apply -f k8s/clearedstack.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: clearedstack
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clearedstack
  namespace: clearedstack
  labels:
    app.kubernetes.io/name: clearedstack
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: clearedstack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clearedstack
    spec:
      # The site never talks to the Kubernetes API, so it gets no credentials.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.example.com/clearedstack:1
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx keeps its pid file and temporary files here.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: clearedstack
  namespace: clearedstack
  labels:
    app.kubernetes.io/name: clearedstack
spec:
  selector:
    app.kubernetes.io/name: clearedstack
  ports:
    - name: http
      port: 80
      targetPort: http
